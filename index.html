<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="صحتي مساحة عربية للنساء: رشاقة بلطف، رياضة منزلية، وتغذية مغربية صحية. برامج أسابيع، وصفات من المطبخ المغربي، وتمارين تناسب إيقاع حياتكِ."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=El+Messiri:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <title>صحتي | رشاقة وتغذية مغربية</title>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("sihati-theme");
          if (theme !== "dark" && theme !== "light" && theme !== "three") {
            theme = window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          }
          if (theme === "dark") document.documentElement.classList.add("dark");
          if (theme === "three") document.documentElement.classList.add("theme-3d");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
